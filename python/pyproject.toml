[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgai-go"
version = "1.3.0"
description = "TGAI GO 鈥斺€?绾?Python 鐨?TGAI 妯″瀷鎺ㄧ悊搴擄紙CPU 寮曟搸锛岄浂缂栬瘧瀹夎锛?
readme = "README.md"
requires-python = ">=3.8"
# 鈽?license 鐢?SPDX 瀛楃涓诧紙2026-10-11 鏀癸級
#   鍘熸潵鍐欑殑鏄?license = { text = "MIT" }锛圱OML 琛ㄥ舰寮忥級锛?
#   setuptools >= 77 宸插純鐢紝鏋勫缓鏃朵細鍒蜂竴澶ф璀﹀憡骞跺０鏄?
#   2027-02-18 鍚庝笉鍐嶆敮鎸併€傛敼鎴?SPDX 琛ㄨ揪寮忓嵆鍙紙鍔?license-files 鏇磋鑼冿級銆?
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TGAI" }]
keywords = ["tgai", "llm", "inference", "moe", "chinese", "llama"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]
dependencies = [
    # 鍙湁 numpy锛氶噰鏍蜂笌寮犻噺杩愮畻鐢?
    "numpy>=1.20",
]

[project.optional-dependencies]
# 澶栭儴鍒嗚瘝鍣紙澶ц瘝琛ㄦā鍨嬬殑鍏滃簳鏂规锛涗笉瑁呬篃鑳借窇鍐呯疆鍒嗚瘝鍣級
tokenizer = ["tokenizers>=0.15"]
# 寮€鍙?娴嬭瘯
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/JXW666NB/TGAI-GO"
Issues = "https://github.com/JXW666NB/TGAI-GO/issues"
Documentation = "https://github.com/JXW666NB/TGAI-GO#readme"
Repository = "https://github.com/JXW666NB/TGAI-GO"

[project.scripts]
# 鍛戒护琛屽叆鍙ｏ紙鍙€夛級锛歵gai-go chat -m model.TG
# 娉ㄦ剰杩欏彧鏄杽灏佽锛屼富瑕佺敤娉曟槸 import tgai_go
tgai-go = "tgai_go.__main__:main"

[tool.setuptools]
# 鈽?_native 蹇呴』鏄惧紡鍒楀嚭锛?026-10-11 淇級
#   瀹冩槸鍙 .dll 鐨勬暟鎹洰褰曘€佹病鏈?__init__.py锛屼絾浠嶈 Python 瑙嗕负
#   "鍙鍏ョ殑鍖?銆傚彧鍐?packages = ["tgai_go"] 鏃?setuptools 浼氳鍛婏細
#     Package 'tgai_go._native' is absent from the `packages` configuration
#     -> Package would be ignored
#   铏界劧瀹炴祴 DLL 浠嶈鎵撹繘 wheel锛堥潬 package-data锛夛紝浣嗚璀﹀憡灞?閰嶇疆鍚硦"锛?
#   闅忔椂鍙兘鍦ㄦ煇涓?setuptools 鐗堟湰鍙樻垚鐪熺殑涓㈡枃浠躲€傛樉寮忓垪鍑烘渶绋炽€?
packages = ["tgai_go", "tgai_go._native"]
include-package-data = true
zip-safe = false

# 璁?examples/*.py 闅?sdist 鍒嗗彂锛堢敤鎴?pip download 瑙ｅ帇灏辫兘鐪嬪埌绀轰緥锛?
[tool.setuptools.data-files]
# 娉ㄦ剰锛氫笉瑁呭埌 site-packages 閲岋紙閬垮厤姹℃煋锛夛紝鍙湪 sdist 涓繚鐣?
# setuptools 鐨?sdist 榛樿浼氬甫涓?MANIFEST.in 閲屽垪鍑虹殑鏂囦欢
# 鈥斺€?瑙佸悓鐩綍 MANIFEST.in

[tool.setuptools.package-data]
# 鈽?鍘熺敓寮曟搸闅忓寘鍒嗗彂锛氱敤鎴?pip install 鍚庢棤闇€缂栬瘧
#   鏂囦欢鍚嶇敱 build_wheel.py 鎸夊钩鍙版斁缃?
"tgai_go" = ["_native/*.dll", "_native/*.so", "_native/*.dylib", "_native/README.md"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*", "*.c", "*.obj", "*.lib", "*.exp"]
